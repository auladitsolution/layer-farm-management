<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Egg Gradient -->
    <linearGradient id="goldGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />

  <!-- Layer Hen & Egg Vector Artwork -->
  <!-- Layer Hen Body (Crisp White) -->
  <path d="M18 45 C17 38 20 31 26 27 C24 23 26 19 30 18 C31 16 34 16 36 17 C38 15 41 16 41 19 C45 22 46 27 43 32 C41 35 39 37 36 39 C34 43 31 46 26 47 C22 47 19 47 18 45 Z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Red Comb -->
  <path d="M30 17 C30 14 33 13 34 15 C36 13 39 14 39 17 C41 16 43 18 42 20 Z" fill="#ef4444" />

  <!-- Hen Eye -->
  <circle cx="34" cy="21" r="1.5" fill="#0f172a" />

  <!-- Yellow Beak -->
  <polygon points="41,21 46,23 41,25" fill="#f59e0b" />

  <!-- Red Wattle -->
  <path d="M39 25 C41 27 39 29 38 28 Z" fill="#ef4444" />

  <!-- Prominent Golden Layer Egg -->
  <ellipse cx="38" cy="38" rx="11" ry="14" fill="url(#goldGrad)" filter="url(#shadow)" transform="rotate(12 38 38)" />
  <!-- Egg Highlight -->
  <ellipse cx="35" cy="32" rx="3" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(12 35 32)" />
</svg>
